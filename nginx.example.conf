# ---------------------------------------------------------------------------
# Ratatosk — vzor pro nginx BĚŽÍCÍ NA HOSTU (ne v kontejneru).
#
#   1. zkopíruj do /etc/nginx/sites-available/ratatosk.conf
#   2. doplň server_name a cestu k projektu (APP_ROOT níž)
#   3. certifikát vyřeš certbotem: certbot --nginx -d ratatosk.example.com
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name ratatosk.example.com;

    # certbot si sem doplní redirect na HTTPS sám; do té doby:
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ratatosk.example.com;

    # ssl_certificate     /etc/letsencrypt/live/ratatosk.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ratatosk.example.com/privkey.pem;

    # Cesta k projektu NA HOSTU (adresář s docker-compose.yml).
    # TOHLE MUSÍŠ ZMĚNIT — jinak nginx nenajde statiku a CSS/JS vrací 404.
    #
    # Pozor, když projekt leží v domovském adresáři: ten mívá práva 0700,
    # takže se do něj nginx (www-data) nedostane a dostaneš 403. Průchod
    # se povolí bez zpřístupnění obsahu:
    #     sudo chmod o+x /home/<uzivatel>
    set $app_root /srv/ratatosk;
    root $app_root/public;
    index index.php;

    # getDisplayMedia i getUserMedia jedou jen v secure contextu (HTTPS).
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Permissions-Policy      "display-capture=(self), microphone=(self)" always;

    # Videa jdou přímo do R2, přes nginx neteče nic velkého.
    client_max_body_size 4m;

    # Statika ze stejného adresáře — PHP se jí ani nedotkne.
    location /assets/ {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;

        # POZOR: cesta musí být ta, kterou vidí KONTEJNER, ne host.
        # docker-compose.yml mountuje projekt na /var/www/html.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;

        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }

    # Nic jiného než index.php do PHP nepouštíme.
    location ~ \.php$ { return 404; }

    # .env, .git a spol. ať nejsou vidět, i kdyby root někdo přepsal.
    location ~ /\. { deny all; }
}
