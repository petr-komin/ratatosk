[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000

; --- Jádro celého rozhodnutí: v klidu tu nesmí trčet žádný worker. -----------
; Po 10 s nečinnosti PHP procesy umřou a zbyde jen fpm master (jednotky MB).
pm                       = ondemand
pm.max_children          = 4
pm.process_idle_timeout  = 10s
pm.max_requests          = 500

; listen.allowed_clients schválně NENÍ nastavené.
; Prázdná hodnota neznamená "kdokoli", ale "nikdo" — fpm pak každý požadavek
; odmítne s "There are no allowed addresses". Zdrojová IP je tady stejně
; docker-proxy z bridge sítě, takže filtrovat podle ní nedává smysl.
; Přístup zvenčí hlídá compose: port je publikovaný jen na 127.0.0.1.

clear_env = no

catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
