<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ratatosk squirrel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- tail (behind) -->
  <path d="M112 190
           C 58 196, 34 156, 46 112
           C 55 78, 82 56, 116 66
           C 92 72, 74 94, 74 122
           C 74 156, 92 178, 120 172 Z"
        fill="#A8552A"/>
  <path d="M108 178
           C 70 182, 54 152, 62 118
           C 69 92, 88 76, 110 82
           C 92 90, 82 106, 82 128
           C 82 152, 94 166, 116 162 Z"
        fill="#C2703D"/>

  <!-- body -->
  <path d="M150 92
           c 36 0, 56 32, 56 68
           c 0 30, -24 48, -56 48
           c -32 0, -52 -20, -52 -50
           c 0 -38, 16 -66, 52 -66 z"
        fill="#C2703D"/>

  <!-- belly -->
  <ellipse cx="152" cy="168" rx="34" ry="36" fill="#E8C39A"/>

  <!-- hind foot -->
  <ellipse cx="176" cy="204" rx="18" ry="11" fill="#A8552A"/>

  <!-- head -->
  <circle cx="150" cy="86" r="34" fill="#C2703D"/>
  <!-- snout -->
  <path d="M176 86 c 14 0, 22 8, 22 18 c 0 8, -8 14, -20 14 c -14 0, -22 -8, -22 -18 c 0 -8, 8 -14, 20 -14 z" fill="#E8C39A"/>
  <!-- ear -->
  <path d="M132 52 c -6 -18, 4 -32, 18 -30 c 6 8, 6 22, -2 34 z" fill="#C2703D"/>
  <path d="M136 54 c -3 -11, 3 -19, 11 -18 c 3 5, 3 13, -2 20 z" fill="#A8552A"/>
  <!-- eye -->
  <circle cx="158" cy="80" r="5.5" fill="#2A211B"/>
  <!-- nose -->
  <circle cx="197" cy="98" r="4.5" fill="#2A211B"/>

  <!-- envelope (message) -->
  <g>
    <rect x="120" y="150" width="60" height="42" rx="6" fill="#F5ECDD" stroke="#8A6A3E" stroke-width="3"/>
    <path d="M122 154 L150 174 L178 154" fill="none" stroke="#8A6A3E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- front paws over the envelope -->
  <ellipse cx="124" cy="176" rx="10" ry="13" fill="#B6642F" transform="rotate(18 124 176)"/>
  <ellipse cx="176" cy="176" rx="10" ry="13" fill="#B6642F" transform="rotate(-18 176 176)"/>
</svg>
